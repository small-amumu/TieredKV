[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tierkv-vllm"
version = "0.0.1"
description = "Tiered KV cache (2-bit base + host residuals) for vLLM - research prototype"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.entry-points."vllm.general_plugins"]
tierkv = "tierkv_vllm:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
